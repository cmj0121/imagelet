name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          # Read the Go version from go.mod so the workflow tracks the module's
          # declared toolchain without a separate config to keep in sync.
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      - run: go build ./...

      # Cross-compile darwin build to catch sysinfo build-tag regressions
      # without a macOS runner. The Linux runner compiles the darwin-tagged
      # files, catching syntax and import errors cheaply.
      - run: GOOS=darwin go build ./...

      - run: go test ./... -count=1
